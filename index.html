/* ================= Markdown 迷你渲染器 ================= */
function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function renderInline(s){
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function(m, alt, u){
    return '<img src="' + u + '" alt="' + alt + '" loading="lazy">';
  });
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(m, t, u){
    if(/^(https?:)?\/\//.test(u) || u.indexOf('#') === 0) return '<a href="' + u + '" target="_blank" rel="noopener">' + t + '</a>';
    return '<a href="' + u + '">' + t + '</a>';
  });
  return s;
}
function renderMD(md){
  var lines = md.split(/\r?\n/);
  var html = '';
  var i = 0, inTable = false, inCode = false, codeBuf = [];
  function closeCode(){
    if(!inCode) return;
    html += '<pre><code>' + codeBuf.join('\n') + '</code></pre>\n';
    codeBuf = []; inCode = false;
  }
  function closeTable(){
    if(!inTable) return;
    html += '</tbody></table>\n';
    inTable = false;
  }
  while(i < lines.length){
    var line = lines[i];
    if(inCode){
      if(/^```/.test(line.trim())){ closeCode(); i++; continue; }
      codeBuf.push(line); i++; continue;
    }
    if(/^```/.test(line.trim())){ closeTable(); inCode = true; i++; continue; }
    var t = line.trim();
    if(!t){ closeTable(); html += '\n'; i++; continue; }
    if(/^\|/.test(t) && /\|$/.test(t)){
      var cells = t.split('|').slice(1,-1).map(function(c){ return c.trim(); });
      if(!inTable){
        inTable = true;
        html += '<table><thead><tr>' + cells.map(function(c){ return '<th>' + renderInline(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
      } else if(cells.every(function(c){ return /^:?-{2,}:?$/.test(c); })){
        /* 分隔行，跳过 */
      } else {
        html += '<tr>' + cells.map(function(c){ return '<td>' + renderInline(c) + '</td>'; }).join('') + '</tr>';
      }
      i++; continue;
    } else if(inTable){ closeTable(); }
    var h = t.match(/^(#{1,4})\s+(.*)$/);
    if(h){
      var lv = h[1].length;
      html += '<h' + lv + '>' + renderInline(h[2]) + '</h' + lv + '>\n';
      i++; continue;
    }
    if(/^>\s?/.test(t)){ html += '<blockquote>' + renderInline(t.replace(/^>\s?/,'')) + '</blockquote>\n'; i++; continue; }
    if(/^[-*]\s+/.test(t)){
      closeTable();
      html += '<ul>';
      while(i < lines.length){
        var lt = lines[i].trim();
        if(/^[-*]\s+/.test(lt)){
          html += '<li>' + renderInline(lt.replace(/^[-*]\s+/,'')) + '</li>';
          i++;
        } else break;
      }
      html += '</ul>\n';
      continue;
    }
    if(/^\d+\.\s+/.test(t)){
      closeTable();
      html += '<ol>';
      while(i < lines.length){
        var lt2 = lines[i].trim();
        if(/^\d+\.\s+/.test(lt2)){
          html += '<li>' + renderInline(lt2.replace(/^\d+\.\s+/,'')) + '</li>';
          i++;
        } else break;
      }
      html += '</ol>\n';
      continue;
    }
    if(/^---+$/.test(t)){ closeTable(); html += '<hr>\n'; i++; continue; }
    closeTable();
    var mImg = t.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
    if(mImg){ html += '<p><img src="' + mImg[2] + '" alt="' + mImg[1] + '" loading="lazy"></p>\n'; i++; continue; }
    html += '<p>' + renderInline(t) + '</p>\n';
    i++;
  }
  closeCode(); closeTable();
  return html;
}

/* ================= Modal 控制 ================= */
var projectModal = document.getElementById('projectModal');
var dlModal = document.getElementById('dlModal');
var modalBody = document.getElementById('modalBody');
var dlBody = document.getElementById('dlBody');
var lastFocus = null;

function lockScroll(lock){ document.body.style.overflow = lock ? 'hidden' : ''; }
function trapFocus(e, modal){
  var focusables = modal.querySelectorAll('a[href], button:not([disabled])');
  if(!focusables.length) return;
  var first = focusables[0], last = focusables[focusables.length - 1];
  if(e.key === 'Tab'){
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
}

function openProject(id){
  var p = PROJECTS.filter(function(x){ return x.id === id; })[0];

    '<div class="modal-hero">' +

          : '<div class="modal-hero__img" style="background:var(--nb-yellow-bg)"></div>')) +
      '<div class="modal-hero__btns">' +
        '<a class="btn btn--secondary" href="' + p.github + '" target="_blank" rel="noopener">开源地址 ↗</a>' +
        demoBtn +

      '<div class="modal-hero__note">下载按钮进入下载菜单：GitHub 源码，或网盘下载（中国移动云盘 / 百度网盘，含各项目子文件夹）</div>' +
    '</div>' +
    '<h3 class="modal-section-title">项目说明（README）</h3>' +
    '<div class="md-body">' + readmeHTML + '</div>';
  projectModal.classList.add('open');
  projectModal.scrollTop = 0;
  lockScroll(true);
  document.getElementById('modalClose').focus();
  var dlBtn = document.getElementById('dlOpenBtn');
  if(dlBtn) dlBtn.addEventListener('click', function(){ openDownload(p); });
}
function closeProject(){
  projectModal.classList.remove('open');
  lockScroll(false);

}

function closeDownload(){

}

/* ================= 事件绑定 ================= */
document.getElementById('modalClose').addEventListener('click', closeProject);
document.getElementById('dlClose').addEventListener('click', closeDownload);
document.getElementById('projectModal').addEventListener('click', function(e){
  if(e.target === this) closeProject();
});
document.getElementById('dlModal').addEventListener('click', function(e){
  if(e.target === this) closeDownload();
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    if(dlModal.classList.contains('open')) closeDownload();
    else if(projectModal.classList.contains('open')) closeProject();
  }
  if(projectModal.classList.contains('open')) trapFocus(e, projectModal);
  if(dlModal.classList.contains('open')) trapFocus(e, dlModal);
});

/* ================= 滚动揭示（尊重 reduced motion） ================= */
var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var revealEls = document.querySelectorAll('.reveal, .reveal-stagger');
function revealAll(){ revealEls.forEach(function(el){ el.classList.add('visible'); }); }
if('IntersectionObserver' in window && !prefersReduced){
  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){ entry.target.classList.add('visible'); observer.unobserve(entry.target); }
    });
  }, { threshold: 0.1 });
  revealEls.forEach(function(el){ observer.observe(el); });
} else { revealAll(); }
